<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LabelCheck — Scan • Eat • Safe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           LabelCheck — Food Safety & Nutrition Scanner
           Design tokens: soft white, light gray, blue, soft pink
           ============================================================ */
        :root {
            /* Core palette */
            --white: #FFFFFF;
            --bg: # #bccbde;
            --gray-50: #F1F4F9;
            --gray-100: #E7ECF3;
            --gray-200: #D8E0EC;
            --gray-300: #B9C4D6;
            --gray-400: #98A6BC;
            --gray-500: #64748B;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1E293B;
            --gray-900: #0F172A;

            /* Blue family */
            --blue: #2B6FFF;
            --blue-light: #EAF1FF;
            --blue-mid: #4D9FFF;
            --blue-dark: #1E50D6;
            --gradient-blue: linear-gradient(135deg, #2B6FFF 0%, #4D9FFF 100%);
            --glow-blue: rgba(43, 111, 255, 0.22);

            /* Pink family */
            --pink: #F472B6;
            --pink-mid: #FB9BC0;
            --pink-light: #FDE7F1;
            --pink-dark: #DB2777;
            --gradient-pink: linear-gradient(135deg, #F472B6 0%, #FB9BC0 100%);
            --glow-pink: rgba(244, 114, 182, 0.20);

            --gradient-app: linear-gradient(135deg, #2B6FFF 0%, #4D9FFF 45%, #F472B6 100%);

            /* Grade colors (stays within blue/pink/gray family) */
            --grade-a: #2B6FFF;   --grade-a-bg: #EAF1FF;
            --grade-b: #1E9FE8;   --grade-b-bg: #E2F5FF;
            --grade-c: #D2539A;   --grade-c-bg: #FDE7F1;
            --grade-d: #E45A6B;   --grade-d-bg: #FEE9EC;
            --grade-e: #8A95A8;   --grade-e-bg: #EEF1F6;

            /* Radii */
            --r-sm: 10px;
            --r-md: 14px;
            --r-lg: 18px;
            --r-xl: 24px;
            --r-full: 999px;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 4px 10px rgba(15, 23, 42, 0.07), 0 8px 24px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.10);
            --shadow-glow: 0 16px 44px rgba(43, 111, 255, 0.22);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { font-size: 16px; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #DBE1EB;
            color: var(--gray-800);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        #root {
            max-width: 430px; margin: 0 auto; min-height: 100vh;
            background: var(--bg);
            box-shadow: 0 0 60px rgba(15, 23, 42, 0.18);
        }

        button { font-family: inherit; border: none; background: none; cursor: pointer; }
        a { text-decoration: none; color: inherit; }
        img { display: block; max-width: 100%; }
        input { font-family: inherit; }

        /* ============ Helpers ============ */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .page { animation: pageIn 0.45s ease both; }
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============ Splash ============ */
        .splash {
            position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 430px; z-index: 100;
            background: linear-gradient(160deg, #EAF1FF 0%, #F7F9FC 55%, #FDE7F1 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .splash-logo { animation: glowPulse 1.6s ease-in-out infinite; }
        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 6px 24px var(--glow-blue)); }
            50%      { filter: drop-shadow(0 10px 40px var(--glow-pink)) brightness(1.06); }
        }
        .splash-tagline {
            margin-top: 22px; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.4em;
            color: var(--gray-600); text-transform: uppercase;
            animation: fadeUp 0.9s ease 0.35s both;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        /* ============ Header ============ */
        .header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
            height: 64px;
        }
        .header-title { display: flex; align-items: center; gap: 10px; }
        .header-name { font-size: 1.25rem; font-weight: 700; color: var(--gray-900); letter-spacing: -0.3px; }
        .profile-btn {
            width: 42px; height: 42px; border-radius: var(--r-full);
            background: var(--gradient-app); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1rem; box-shadow: var(--shadow-md);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .profile-btn:hover { transform: scale(1.06); box-shadow: var(--shadow-glow); }
        .header-divider { height: 1px; background: var(--gray-100); }

        /* ============ Buttons ============ */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 22px; border-radius: var(--r-md); font-weight: 600; font-size: 0.95rem;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--gradient-blue); color: #fff; box-shadow: 0 8px 20px var(--glow-blue); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(43, 111, 255, 0.3); }
        .btn-pink { background: var(--gradient-pink); color: #fff; box-shadow: 0 8px 20px var(--glow-pink); }
        .btn-pink:hover { transform: translateY(-2px); }
        .btn-soft { background: var(--gray-100); color: var(--gray-700); }
        .btn-soft:hover { background: var(--gray-200); }
        .btn-outline { border: 1.5px solid var(--gray-200); color: var(--gray-600); background: #fff; }
        .btn-outline:hover { border-color: var(--blue); color: var(--blue); }
        .btn-block { width: 100%; }

        /* Back button */
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--gray-600); font-weight: 600; font-size: 0.95rem;
            padding: 8px 12px; border-radius: var(--r-sm);
            transition: background 0.15s ease, color 0.15s ease;
        }
        .back-btn:hover { background: var(--gray-100); color: var(--gray-900); }

        /* ============ Page titles ============ */
        .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 26px 0 8px; }
        .page-title { font-size: 1.6rem; font-weight: 700; color: var(--gray-900); letter-spacing: -0.4px; }
        .page-sub { color: var(--gray-500); margin-bottom: 18px; font-size: 0.95rem; }

        /* ============ Scan hero ============ */
        .scan-hero {
            position: relative; border-radius: var(--r-xl);
            padding: 34px 30px; margin: 26px 0 8px; overflow: hidden;
            background: linear-gradient(135deg, #ffffff 0%, #FBFCFF 55%, #FFF4F9 100%);
            border: 1px solid var(--gray-100); box-shadow: var(--shadow-md);
        }
        .scan-hero::before {
            content: ''; position: absolute; inset: -40%;
            background: radial-gradient(40% 60% at 20% 10%, var(--glow-blue), transparent 70%),
                        radial-gradient(40% 60% at 85% 90%, var(--glow-pink), transparent 70%);
            pointer-events: none;
        }
        .scan-hero-inner { position: relative; z-index: 1; text-align: center; max-width: 560px; margin: 0 auto; }
        .scan-hero h2 { font-size: 1.9rem; font-weight: 800; color: var(--gray-900); letter-spacing: -0.5px; }
        .scan-hero p { color: var(--gray-500); margin: 8px 0 22px; font-size: 1rem; }
        .scan-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .scan-icon-badge {
            width: 74px; height: 74px; margin: 0 auto 18px; border-radius: var(--r-lg);
            background: var(--gradient-app); color: #fff; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-glow);
        }
        .demo-note { margin-top: 18px; font-size: 0.78rem; color: var(--gray-400); }

        /* Grade legend */
        .grade-legend { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
        .legend-chip {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 0.75rem; font-weight: 600; padding: 5px 10px; border-radius: var(--r-full);
        }
        .legend-letter {
            width: 18px; height: 18px; border-radius: 50%; color: #fff; font-size: 0.7rem; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center;
        }

        /* ============ Search ============ */
        .search-wrap { position: relative; max-width: 560px; margin: 18px auto 4px; }
        .search-input {
            width: 100%; padding: 13px 18px 13px 46px; border-radius: var(--r-full);
            border: 1.5px solid var(--gray-200); background: #fff; font-size: 0.95rem;
            box-shadow: var(--shadow-sm); transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .search-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px var(--glow-blue); }
        .search-icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--gray-400); display: flex;
        }
        .search-results {
            position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30;
            background: #fff; border-radius: var(--r-md); box-shadow: var(--shadow-lg);
            border: 1px solid var(--gray-100); overflow: hidden;
        }
        .search-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px; width: 100%;
            text-align: left; transition: background 0.15s ease;
        }
        .search-item:hover { background: var(--gray-50); }
        .search-item-name { font-weight: 600; font-size: 0.9rem; color: var(--gray-800); flex: 1; }
        .search-item-cat { font-size: 0.75rem; color: var(--gray-400); }
        .search-empty { padding: 14px; text-align: center; color: var(--gray-400); font-size: 0.9rem; }

        /* ============ Cards & grids ============ */
        .section-title { font-size: 1.15rem; font-weight: 700; margin: 30px 0 16px; color: var(--gray-900); }
        .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
        .sub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }

        .card {
            background: #fff; border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-100); overflow: hidden;
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }

        /* Category card */
        .cat-card { padding: 26px 22px; cursor: pointer; position: relative; min-height: 210px; display: flex; flex-direction: column; }
        .cat-card .cat-icon {
            width: 62px; height: 62px; border-radius: var(--r-md); color: #fff;
            display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
        }
        .cat-card h3 { font-size: 1.2rem; font-weight: 700; color: var(--gray-900); }
        .cat-card p { color: var(--gray-500); font-size: 0.9rem; margin-top: 6px; flex: 1; }
        .cat-arrow {
            position: absolute; top: 24px; right: 22px; width: 36px; height: 36px; border-radius: 50%;
            background: var(--gray-50); color: var(--gray-500); display: flex; align-items: center; justify-content: center;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }
        .cat-card:hover .cat-arrow { background: var(--gradient-app); color: #fff; transform: translateX(3px); }

        /* Subcategory card */
        .sub-card { padding: 22px 18px; cursor: pointer; display: flex; align-items: center; gap: 54px; }
        .sub-card .sub-icon {
            width: 52px; height: 52px; border-radius: var(--r-md); color: #fff;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .sub-card h4 { font-size: 1.02rem; font-weight: 700; color: var(--gray-900); }
        .sub-card p { font-size: 0.8rem; color: var(--gray-500); margin-top: 2px; }
        .sub-card .count { margin-left: auto; font-size: 0.78rem; color: var(--gray-400); font-weight: 600; }

        /* Product card */
        .product-card { display: flex; flex-direction: column; }
        .p-thumb {
            height: 150px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--gray-50), #fff);
            position: relative; overflow: hidden;
        }
        .p-tile {
            width: 64px; height: 64px; border-radius: var(--r-md); color: #fff; font-weight: 800; font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-md);
        }
        .p-body { padding: 16px 16px 18px; display: flex; flex-direction: column; flex: 1; }
        .p-name { font-weight: 700; font-size: 1.02rem; color: var(--gray-900); }
        .p-serving { font-size: 0.76rem; color: var(--gray-400); margin-top: 2px; }
        .p-facts { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
        .p-fact {
            background: var(--gray-50); border-radius: var(--r-sm); padding: 6px 10px;
            font-size: 0.78rem; color: var(--gray-600); font-weight: 500;
        }
        .p-fact b { color: var(--gray-900); }
        .p-card-row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; gap: 8px; }
        .p-actions { display: flex; gap: 8px; margin-top: 12px; }
        .p-actions .btn { padding: 9px 14px; font-size: 0.85rem; flex: 1; }

        /* Grade badge */
        .grade-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 46px; height: 46px; border-radius: var(--r-md); font-weight: 800; font-size: 1.35rem;
        }
        .grade-badge-lg { width: 66px; height: 66px; font-size: 1.9rem; border-radius: var(--r-lg); }
        .grade-badge-sm { width: 34px; height: 34px; font-size: 1rem; border-radius: 10px; }
        .grade-A { background: var(--grade-a-bg); color: var(--grade-a); }
        .grade-B { background: var(--grade-b-bg); color: var(--grade-b); }
        .grade-C { background: var(--grade-c-bg); color: var(--grade-c); }
        .grade-D { background: var(--grade-d-bg); color: var(--grade-d); }
        .grade-E { background: var(--grade-e-bg); color: var(--grade-e); }
        .grade-label { font-size: 0.8rem; font-weight: 600; }

        /* ============ Product detail ============ */
        .detail-hero {
            display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
            background: #fff; border: 1px solid var(--gray-100); border-radius: var(--r-xl);
            padding: 26px; box-shadow: var(--shadow-md); margin-top: 18px;
        }
        .detail-hero .p-tile { width: 86px; height: 86px; font-size: 2rem; border-radius: var(--r-lg); }
        .detail-hero-info { flex: 1; min-width: 220px; }
        .detail-hero-info h1 { font-size: 1.5rem; font-weight: 800; color: var(--gray-900); letter-spacing: -0.4px; }
        .detail-hero-info .p-serving { font-size: 0.85rem; margin-top: 4px; }
        .grade-wrap { display: flex; align-items: center; gap: 12px; }

        .panel {
            background: #fff; border: 1px solid var(--gray-100); border-radius: var(--r-lg);
            padding: 24px; box-shadow: var(--shadow-sm); margin-top: 18px;
        }
        .panel h3 { font-size: 1.05rem; font-weight: 700; color: var(--gray-900); margin-bottom: 16px; }

        /* Nutrition bars */
        .nutri-row { margin-bottom: 13px; }
        .nutri-top { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
        .nutri-top .nutri-val { font-weight: 700; color: var(--gray-900); }
        .nutri-track { height: 8px; background: var(--gray-100); border-radius: var(--r-full); overflow: hidden; }
        .nutri-fill { height: 100%; border-radius: var(--r-full); transition: width 0.6s ease; }

        /* Ingredient chips */
        .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            background: var(--gray-50); border: 1px solid var(--gray-100); color: var(--gray-600);
            border-radius: var(--r-full); padding: 7px 14px; font-size: 0.85rem; font-weight: 500;
        }
        .chip-flag { background: var(--pink-light); border-color: #FBE1EE; color: var(--pink-dark); }
        .chip-safe { background: var(--blue-light); border-color: #D6E4FF; color: var(--blue-dark); }

        /* Safety analysis */
        .safety-item { display: flex; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--gray-50); align-items: flex-start; }
        .safety-item:last-child { border-bottom: none; }
        .safety-dot {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem; margin-top: 2px;
        }
        .ok { background: var(--blue-light); color: var(--blue); }
        .warn { background: var(--pink-light); color: var(--pink-dark); }
        .safety-body { flex: 1; }
        .safety-body b { display: block; font-size: 0.92rem; color: var(--gray-800); }
        .safety-body span { font-size: 0.85rem; color: var(--gray-500); }

        /* Grade explanation */
        .reason-item { display: flex; gap: 10px; padding: 8px 0; font-size: 0.92rem; color: var(--gray-600); align-items: flex-start; }
        .reason-item .dot { margin-top: 7px; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .note-box {
            background: var(--gray-50); border-radius: var(--r-md); padding: 14px 16px;
            font-size: 0.82rem; color: var(--gray-500); margin-top: 18px;
        }

        /* ============ Scanner page ============ */
        .scanner-wrap { position: relative; max-width: 460px; margin: 26px auto; }
        .scan-frame {
            aspect-ratio: 1; border-radius: var(--r-xl);
            background: linear-gradient(160deg, #1E293B, #0F172A);
            position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-lg);
        }
        .scan-target { width: 62%; height: 62%; border-radius: 24px; position: relative; }
        .scan-corner {
            position: absolute; width: 26px; height: 26px; border: 3px solid var(--blue-mid);
        }
        .corner-tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
        .corner-tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 10px 0 0; }
        .corner-bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 10px; }
        .corner-br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 10px 0; }
        .scan-laser {
            position: absolute; left: 6%; right: 6%; height: 3px;
            background: var(--gradient-pink); border-radius: var(--r-full);
            box-shadow: 0 0 14px var(--glow-pink);
            animation: laserMove 1.9s ease-in-out infinite;
        }
        @keyframes laserMove { 0%, 100% { top: 12%; } 50% { top: 86%; } }
        .scan-status { text-align: center; font-weight: 700; color: var(--gray-700); margin-top: 22px; font-size: 1.05rem; }
        .scan-hint { text-align: center; color: var(--gray-400); font-size: 0.85rem; margin-top: 6px; }

        /* Detected result */
        .detected { text-align: center; margin-top: 22px; }
        .detected .check-circle {
            width: 66px; height: 66px; border-radius: 50%; margin: 0 auto 14px;
            background: var(--gradient-blue); color: #fff; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-glow); animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes popIn { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .detected-title { font-size: 1.3rem; font-weight: 800; color: var(--gray-900); }
        .detected-scan { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }

        /* ============ Profile ============ */
        .profile-card {
            display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
            background: #fff; border: 1px solid var(--gray-100); border-radius: var(--r-xl);
            padding: 26px; box-shadow: var(--shadow-md); margin-top: 22px;
        }
        .profile-avatar {
            width: 84px; height: 84px; border-radius: 50%;
            background: var(--gradient-app); color: #fff; font-size: 2.2rem; font-weight: 800;
            display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-md);
        }
        .profile-meta { flex: 1; min-width: 180px; }
        .profile-meta h2 { font-size: 1.35rem; font-weight: 800; color: var(--gray-900); }
        .profile-meta p { color: var(--gray-500); font-size: 0.92rem; }
        .profile-stats { display: flex; gap: 28px; margin-top: 12px; }
        .stat b { font-size: 1.25rem; color: var(--gray-900); display: block; }
        .stat span { font-size: 0.75rem; color: var(--gray-400); }
        .settings-row {
            display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
            padding: 15px 6px; border-bottom: 1px solid var(--gray-50); color: var(--gray-700);
            font-weight: 500; font-size: 0.95rem; transition: padding 0.15s ease;
        }
        .settings-row:hover { padding-left: 10px; background: var(--gray-50); border-radius: var(--r-sm); }
        .settings-row .ic { color: var(--blue); display: flex; }

        /* ============ Bottom nav (mobile) ============ */
        .bottom-nav {
            position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 60;

    <!-- ============================================================
         GRADE ENGINE — simple prototype scoring (clearly non-medical)
         ============================================================ -->
    <script>
        /* A simple, clearly-commented prototype scoring function.
           Later this can be replaced with a real nutrition-scoring
           algorithm (e.g. UK FSA "traffic light" front-of-pack model). */
        function computeGrade(p) {
            var score = 50;
            var flags = [];

            // Calories (per 100 g/ml)
            if (p.calories <= 100) { score += 15; flags.push('low-calorie'); }
            else if (p.calories <= 250) { score += 8; }
            else if (p.calories > 400) { score -= 15; flags.push('high-calorie'); }

            // Sugar
            if (p.sugar <= 5) { score += 12; flags.push('low-sugar'); }
            else if (p.sugar <= 12) { score += 5; }
            else if (p.sugar <= 22.5) { score -= 8; flags.push('moderate-sugar'); }
            else { score -= 18; flags.push('high-sugar'); }

            // Fat
            if (p.fat <= 3) { score += 8; flags.push('low-fat'); }
            else if (p.fat <= 10) { score += 3; }
            else { score -= 10; flags.push('high-fat'); }

            // Protein (positive)
            if (p.protein >= 15) { score += 10; flags.push('high-protein'); }
            else if (p.protein >= 8) { score += 6; }
            else if (p.protein >= 3) { score += 2; }

            // Sodium
            if (p.sodium <= 200) { score += 6; flags.push('low-sodium'); }
            else if (p.sodium <= 600) { score += 2; }
            else { score -= 8; flags.push('high-sodium'); }

            // Additives & artificial colours reduce the score
            var addCount = (p.additives ? p.additives.length : 0) + (p.artificialColors ? p.artificialColors.length : 0);
            if (addCount > 0) { score -= addCount * 3; flags.push('additives'); }

            score = Math.max(0, Math.min(100, score));

            var letter = score >= 80 ? 'A' : score >= 65 ? 'B' : score >= 50 ? 'C' : score >= 35 ? 'D' : 'E';
            var label = { A: 'Excellent choice', B: 'Good choice', C: 'Moderate', D: 'Limit consumption', E: 'Least healthy choice' }[letter];

            return { score: score, letter: letter, label: label, flags: flags };
        }

        /* Where nutritional profile is grade-based */
        function gradeStyle(letter) {
            return { 'A': 'grade-A', 'B': 'grade-B', 'C': 'grade-C', 'D': 'grade-D', 'E': 'grade-E' }[letter] || 'grade-E';
        }
        function gradeColor(letter) {
            return { 'A': '#2B6FFF', 'B': '#1E9FE8', 'C': '#D2539A', 'D': '#E45A6B', 'E': '#8A95A8' }[letter] || '#8A95A8';
        }

            var map = {

    const frontendCategory = decodeURIComponent(category || "");
    const backendCategory = apiCategory(frontendCategory.toLowerCase());

    const url =

    const response = await fetch(url);

    console.log("CATEGORY API STATUS:", response.status);

    if (!response.ok) {
        throw new Error(

        );
    }

    if (!text || !text.trim()) {
        throw new Error(`Category API returned an empty response for ${url}`);
    }

    let foods;

    <script type="text/babel" data-presets="react">
        /* ---------- Routing helpers (hash-based, no libs needed) ---------- */
        function Router() {
            var route = { name: 'home', params: {} };
            var hash = window.location.hash.replace(/^#\/?/, '');
            var parts = hash.split('/').filter(Boolean);
            if (parts.length === 0) { route.name = 'home'; }
            else if (parts[0] === 'profile') { route.name = 'profile'; }
            else if (parts[0] === 'categories') { route.name = 'categories'; }
            else if (parts[0] === 'category' && parts[1]) { route.name = 'category'; route.params.id = parts[1]; }
            else if (parts[0] === 'list' && parts[1]) { route.name = 'list'; route.params.id = parts[1]; }
            else if (parts[0] === 'product' && parts[1] && parts[2] && parts[3]) {
                route.name = 'product';
                route.params.category = decodeURIComponent(parts[1]);
                route.params.subCategory = decodeURIComponent(parts[2]);
                route.params.id = Number(parts[3]);
            }
            else if (parts[0] === 'scan') { route.name = 'scan'; route.params.variant = parts[1] || null; }
            return route;
        }
        function go(path) { window.location.hash = '#' + path; }
        function goBack() { if (window.history.length > 1) window.history.back(); else go('/'); }

        /* ---------- Product image (real photo if IMAGE_MAP has a URL, else gradient tile) ---------- */
        function ProductImage({ product, size = 64, fontSize = 1.5, round = 14, cover = false }) {
            const [broken, setBroken] = React.useState(false);
            const url = IMAGE_MAP[productKey(product)];
            if (url && !broken) {
                const style = cover
                    ? { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', borderRadius: round }
                    : { width: size * 2.4, height: size * 1.4, objectFit: 'cover', borderRadius: round };
                return <img key={product.id} src={url} alt={product.name} style={style} onError={() => setBroken(true)} />;
            }
            const grad = { beverages: 'linear-gradient(135deg,#2B6FFF,#4D9FFF)', solid: 'linear-gradient(135deg,#F472B6,#FB9BC0)', grocery: 'linear-gradient(135deg,#6E7BF0,#4D9FFF)' };
            return (
                <div
                    className="p-tile"
                    style={{ background: grad[product.category] || grad.beverages, fontSize: fontSize + 'rem', width: size, height: size }}
                >
                    {product.name.charAt(0).toUpperCase()}
                </div>
            );
        }

        /* ---------- Grade badge ---------- */
        function GradeBadge({ product, size = '' }) {
            const grade = computeGrade(product);
            return (
                <div className="grade-wrap">
                    <div className={`grade-badge ${size} ${gradeStyle(grade.letter)}`}>{grade.letter}</div>
                    <div>
                        <div className="grade-label" style={{ color: gradeColor(grade.letter) }}>{grade.label}</div>
                        <div style={{ fontSize: 11, color: 'var(--gray-400)', marginTop: 1 }}>Prototype rating</div>
                    </div>
                </div>
            );

        /* ---------- Search bar with live dropdown results ---------- */
        function SearchBar({ placeholder = 'Search food or beverage...', scope = null, onPick }) {
            const [q, setQ] = React.useState('');
            const [focused, setFocused] = React.useState(false);
            const all = !scope ? PRODUCTS
                : (Array.isArray(scope) ? PRODUCTS.filter((p) => scope.indexOf(p.subcategory) > -1) : getBySubcategory(scope));
            const results = all.filter(function (p) {
                return q && (p.name.toLowerCase().indexOf(q) > -1 ||
                    p.ingredients.join(' ').toLowerCase().indexOf(q) > -1);
            }).slice(0, 6);

            return (
                <div className="search-wrap">
                    <span className="search-icon"><IcSearch size={18} /></span>
                    <input
                        className="search-input"
                        placeholder={placeholder}
                        value={q}
                        onChange={(e) => setQ(e.target.value)}
                        onFocus={() => setFocused(true)}
                        onBlur={() => setTimeout(() => setFocused(false), 150)}
                    />
                    {focused && q && (
                        <div className="search-results">
                            {results.length === 0 && <div className="search-empty">No matches found</div>}
                            {results.map((p) => (
                                <button key={p.id} className="search-item" onMouseDown={() => { if (onPick) onPick(p); go('/product/' + encodeURIComponent(p.category || '') + '/' + encodeURIComponent(p.subcategory || '') + '/' + p.id); }}>

        /* ---------- Category card (Beverages / Solid / Grocery) ---------- */
        const CAT_ICONS = { can: IcCan, cookie: IcCookie, bag: IcBag };

            beverages: 'linear-gradient(135deg,#2B6FFF,#4D9FFF)',

                        <h4>{sub.name}</h4>
                        <p>{sub.desc}</p>
                    </div>
                </button>
            );
        }

        /* ---------- Product card (with View Details + Scan Variant) ---------- */
        function ProductCard({ p }) {
            const grade = computeGrade(p);
            return (
                <div className="card product-card">
                    <div className="p-thumb">
                        <ProductImage product={p} size={64} cover />
                    </div>
                    <div className="p-body">
                        <div className="p-card-row">
                            <div>
                                <div className="p-name">{p.name}</div>

                        <div className="p-facts">

                            <span className="p-fact">Sugar <b>{p.sugar}g</b></span>

                        <div className="p-actions">
                            <button className="btn btn-primary" onClick={() => go('/product/' + encodeURIComponent(p.category || '') + '/' + encodeURIComponent(p.subcategory || '') + '/' + p.id)}>View Details</button>
                            <button className="btn btn-outline" onClick={() => go('/scan/' + p.id)}>Scan Variant</button>

                </div>
            );

        /* ---------- Product list page ---------- */
        function ListPage({ id }) {
    const sub = getSubcategory(id);

    const [products, setProducts] = React.useState([]);
    const [loading, setLoading] = React.useState(true);
    const [error, setError] = React.useState(null);

    React.useEffect(() => {
        async function loadProducts() {
            try {
                setLoading(true);
                setError(null);

                if (!sub) {
                    throw new Error("Subcategory not found.");
                }

                // Find the parent category from CATEGORIES.
                let parentCategory = null;

                for (let i = 0; i < CATEGORIES.length; i++) {
                    if (
                        CATEGORIES[i].subs.some(function(s) {
                            return s.id === id;
                        })
                    ) {
                        parentCategory = CATEGORIES[i];
                        break;
                    }
                }

                if (!parentCategory) {
                    throw new Error("Parent category not found.");
                }

                // Fetch ALL products for the parent category from MariaDB.
                const allProducts = await getFoodsFromAPI(parentCategory.id);

                // Match the database subCategory against the exact backend
                // value for this frontend route (e.g. milkshakes -> Milkshake).
                const expectedSubCategory = apiSubCategory(id);

                const filteredProducts = allProducts.filter(function(p) {
                    return String(p.subcategory || "").trim().toLowerCase() ===
                           String(expectedSubCategory || "").trim().toLowerCase();
                });

                console.log(
                    "SUBCATEGORY:", expectedSubCategory,
                    "ALL PRODUCTS:", allProducts.length,
                    "MATCHED PRODUCTS:", filteredProducts.length
                );

                setProducts(filteredProducts);
            } catch (err) {
                console.error("PRODUCT LIST API ERROR:", err);
                setError(err.message || "Failed to load products.");
            } finally {
                setLoading(false);
            }
        }

        loadProducts();
    }, [id]);

    if (!sub) {
        return (
            <div className="container page">
                <button className="back-btn" onClick={goBack}>
                    <IcBack size={18} /> Back
                </button>
                <p>Products not found.</p>
            </div>
        );
    }

    if (loading) {
        return (
            <div className="container page">
                <div style={{ marginTop: 34 }}>
                    <button className="back-btn" onClick={goBack}>
                        <IcBack size={18} /> Back
                    </button>
                </div>
                <div className="page-head">
                    <h1 className="page-title">{sub.name}</h1>
                </div>
                <p className="page-sub">Loading products from database...</p>
            </div>
        );
    }

    if (error) {
        return (
            <div className="container page">
                <div style={{ marginTop: 34 }}>
                    <button className="back-btn" onClick={goBack}>
                        <IcBack size={18} /> Back
                    </button>
                </div>
                <div className="page-head">
                    <h1 className="page-title">{sub.name}</h1>
                </div>
                <p className="page-sub">{error}</p>
            </div>
        );
    }

    return (
        <div className="container page">
            <div style={{ marginTop: 34 }}>
                <button className="back-btn" onClick={goBack}>
                    <IcBack size={18} /> Back
                </button>
            </div>

            <div className="page-head">
                <h1 className="page-title">{sub.name}</h1>
            </div>

            <SearchBar scope={id} onPick={() => {}} />
            <br/>
            <div className="product-grid">
                {products.length > 0 ? (
                    products.map(function(p) {
                        return <ProductCard key={p.id} p={p} />;
                    })
                ) : (
                    <p>No products found in this subcategory.</p>
                )}
            </div>
        </div>
    );
}

        /* ---------- Product details ---------- */
        const NUTRI_MAX = { calories: 500, fat: 40, saturatedFat: 25, carbohydrates: 80, sugar: 60, protein: 30, sodium: 1500 };
        const NUTRI_LABEL = { calories: 'Calories', fat: 'Total Fat', saturatedFat: 'Saturated Fat', carbohydrates: 'Carbohydrates', sugar: 'Sugar', protein: 'Protein', sodium: 'Sodium' };
        const NUTRI_UNIT = { calories: 'kcal', fat: 'g', saturatedFat: 'g', carbohydrates: 'g', sugar: 'g', protein: 'g', sodium: 'mg' };
        const NUTRI_COLORS = { calories: '#2B6FFF', fat: '#F472B6', saturatedFat: '#FB9BC0', carbohydrates: '#4D9FFF', sugar: '#DB2777', protein: '#1E9FE8', sodium: '#8A95A8' };

        function NutritionBar({ k, v }) {
            const pct = Math.min(100, Math.round((v / NUTRI_MAX[k]) * 100));
            return (
                <div className="nutri-row">
                    <div className="nutri-top">
                        <span>{NUTRI_LABEL[k]} <span style={{ color: 'var(--gray-400)' }}>({NUTRI_UNIT[k]})</span></span>
                        <span className="nutri-val">{v}</span>
                    </div>
                    <div className="nutri-track"><div className="nutri-fill" style={{ width: pct + '%', background: NUTRI_COLORS[k] }} /></div>
                </div>
            );
        }

        function IngredientList({ p }) {
            const flagged = (p.artificialColors || []).concat(p.additives || []);
            return (
                <div className="chip-wrap">
                    {p.ingredients.map((ing, i) => {
                        const isFlag = flagged.some((f) => ing.toLowerCase().indexOf(f.toLowerCase()) > -1);
                        return <span key={i} className={`chip ${isFlag ? 'chip-flag' : ''}`}>{ing}</span>;
                    })}
                </div>
            );
        }

        function SafetyAnalysis({ p }) {
            const grade = computeGrade(p);
            const items = [
                { t: 'Artificial Colours', ok: !p.artificialColors || p.artificialColors.length === 0, detail: (p.artificialColors && p.artificialColors.length) ? p.artificialColors.join(', ') : 'None detected' },
                { t: 'Preservatives / Additives', ok: !p.additives || p.additives.length === 0, detail: (p.additives && p.additives.length) ? p.additives.join(', ') : 'None listed' },
                { t: 'High Sugar', ok: p.sugar <= 22.5, detail: p.sugar + ' g / 100' + (p.sugar > 22.5 ? ' — above guideline' : ' — within guideline') },
                { t: 'High Fat', ok: p.fat <= 17.5, detail: p.fat + ' g / 100' + (p.fat > 17.5 ? ' — above guideline' : ' — within guideline') },
                { t: 'High Sodium', ok: p.sodium <= 600, detail: p.sodium + ' mg / 100' + (p.sodium > 600 ? ' — above guideline' : ' — within guideline') },
                { t: 'Allergens', ok: !p.allergens || p.allergens.length === 0, detail: (p.allergens && p.allergens.length) ? p.allergens.join(', ') : 'None declared' }
            ];
            return (
                <div>
                    {items.map((it, i) => (
                        <div key={i} className="safety-item">
                            <div className={`safety-dot ${it.ok ? 'ok' : 'warn'}`}>{it.ok ? '✓' : '!'}</div>
                            <div className="safety-body"><b>{it.t}</b><span>{it.detail}</span></div>
                        </div>
                    ))}
                </div>
            );
        }

        function WhyThisGrade({ p }) {
            const grade = computeGrade(p);
            const lines = [];
            lines.push(p.sugar > 22.5 ? 'High sugar (' + p.sugar + ' g/100) lowers the rating.' : p.sugar <= 5 ? 'Low sugar content is a positive factor.' : 'Sugar content is moderate.');
            lines.push(p.fat > 17.5 ? 'High total fat contributes negatively.' : p.fat <= 3 ? 'Low fat content helps the rating.' : 'Fat content is moderate.');
            lines.push(p.sodium > 600 ? 'Sodium is above the guideline level.' : p.sodium <= 200 ? 'Sodium is low — a positive factor.' : 'Sodium level is acceptable.');
            lines.push(p.protein >= 8 ? 'Good protein content adds value.' : 'Protein content is low.');
            const addCount = (p.additives ? p.additives.length : 0) + (p.artificialColors ? p.artificialColors.length : 0);
            lines.push(addCount > 0 ? addCount + ' additive/colour entr' + (addCount > 1 ? 'ies' : 'y') + ' listed reduce the score.' : 'No artificial colours or additives listed.');
            return (
                <div>
                    {lines.map((l, i) => (
                        <div key={i} className="reason-item">
                            <span className="dot" style={{ background: gradeColor(grade.letter) }} />
                            <span>{l}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function ProductPage({ id, category, subCategory }) {
    const [product, setProduct] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    const [error, setError] = React.useState(null);

    React.useEffect(() => {
        async function loadProduct() {
            try {
                setLoading(true);
                setError(null);

                const idMatch = String(id || '').match(/(\d+)$/);
                const numericId = idMatch ? Number(idMatch[1]) : Number(id);

                console.log("ProductPage received:", {
                    id,
                    numericId,
                    category,
                    subCategory
                });

                if (!category || !subCategory || Number.isNaN(numericId)) {
                    throw new Error(
                        "Missing product category, subcategory, or valid numeric ID."
                    );
                }

                const data = await getFoodFromAPI(
                    category,
                    subCategory,
                    numericId
                );

                setProduct(data);
            } catch (err) {
                console.error("API ERROR:", err);
                setError(err.message || "Failed to load product.");
            } finally {
                setLoading(false);
            }
        }

        loadProduct();
    }, [id, category, subCategory]);



    if (loading) {
        return (
            <div className="container page">
                <p>Loading product...</p>
            </div>
        );
    }

    if (error || !product) {
        return (
            <div className="container page">
                <button className="btn btn-soft" onClick={goBack}>
                    ← Back
                </button>
                <p>{error || "Product not found."}</p>
            </div>
        );
    }

    const p = product;

    const grade = computeGrade(p);

    const nutrients = [
        'calories',
        'fat',
        'saturatedFat',
        'carbohydrates',
        'sugar',
        'protein',
        'sodium'
    ];

    return (
        <div className="container page">

            <div style={{ marginTop: 34 }}>
                <button className="back-btn" onClick={goBack}>
                    <IcBack size={18} /> Back
                </button>
            </div>

            <div className="product-layout">

                <ProductImage product={p} />

                <div className="product-info">

                    <h1>{p.name}</h1>

                    <div className="p-brand">
                        {p.brand}
                    </div>

                    <div className="p-serving">
                        {p.serving}
                    </div>

                    {/* Nutrition */}
                    <div className="nutrition-list">
                        {nutrients.map((k) => (
                            <NutritionBar
                                key={k}
                                k={k}
                                v={p[k]}
                            />
                        ))}
                    </div>

                    {/* Ingredients */}
                    <IngredientList p={p} />

                    {/* Safety */}
                    <SafetyAnalysis p={p} />

                    {/* Grade explanation */}
                    <WhyThisGrade p={p} />

                </div>
            </div>
        </div>
    );
}
        /* ---------- Scanner page (simulated) ---------- */
        function ScannerPage({ variant }) {
            const [state, setState] = React.useState('idle'); // idle | scanning | done
            const [detected, setDetected] = React.useState(null);

            React.useEffect(() => {
                setState('idle');
                // When scanning a variant, detect a different product from the sample pool.
                const pool = variant ? PRODUCTS.filter((p) => p.id !== variant) : PRODUCTS;
                setDetected(pool[Math.floor(Math.random() * pool.length)] || PRODUCTS[0]);
            }, [variant]);

            const startScan = () => {
                setState('scanning');
                setTimeout(() => setState('done'), 2000);
            };

            return (
                <div className="container page">
                    
                    <div style={{ marginTop: 34 }}>
                        <button className="back-btn" onClick={goBack}><IcBack size={18} /> Back</button>
                    </div>
                    <div className="page-head"><h1 className="page-title">Scan Your Product</h1></div>
                    <p className="page-sub">Simulated scanner — align the packet inside the frame.</p>

                    <div className="scanner-wrap">
                        <div className="scan-frame">
                            <div className="scan-target">
                                <div className="scan-corner corner-tl" /><div className="scan-corner corner-tr" />
                                <div className="scan-corner corner-bl" /><div className="scan-corner corner-br" />
                                {state === 'scanning' && <div className="scan-laser" />}
                                {state === 'idle' && <IcScan size={72} color="rgba(255,255,255,0.35)" />}
                                {state === 'done' && <IcCheck size={64} color="#4D9FFF" />}
                            </div>
                        </div>

                        <div className="scan-status">
                            {state === 'idle' && 'Ready to scan'}
                            {state === 'scanning' && 'Scanning…'}
                            {state === 'done' && 'Product Detected!'}
                        </div>
                        <div className="scan-hint">
                            {state === 'done' ? detected.name + ' found from sample data' : 'Frontend prototype — no real camera used yet'}
                        </div>

                        {state === 'idle' && (
                            <div className="scan-actions" style={{ marginTop: 22 }}>
                                <button className="btn btn-primary" onClick={startScan}><IcCamera2 size={18} /> Capture</button>
                                <button className="btn btn-pink" onClick={startScan}><IcUpload size={18} /> Upload Image</button>
                            </div>
                        )}

                        {state === 'done' && (
                            <div className="detected">
                                <div className="check-circle"><IcCheck size={30} color="#fff" /></div>
                                <div className="detected-title">{detected.name}</div>
                                <div style={{ display: 'flex', justifyContent: 'center', marginTop: 14 }}>
                                    <GradeBadge product={detected} />
                                </div>
                                <div className="detected-scan">
                                    <button className="btn btn-primary" onClick={() => go('/product/' + encodeURIComponent(detected.category || '') + '/' + encodeURIComponent(detected.subcategory || '') + '/' + detected.id)}>View Details</button>
                                    <button className="btn btn-soft" onClick={startScan}>Scan Again</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        /* ---------- Profile page (dummy data) ---------- */
        function ProfilePage() {
            const saved = PRODUCTS.filter(function (p) { return (p.category === 'solid' && p.subcategory === 'chips' && p.id === 1) || (p.category === 'solid' && p.subcategory === 'chocolate' && p.id === 1) || (p.category === 'beverages' && p.subcategory === 'soft-drinks' && p.id === 1) || (p.category === 'grocery' && p.subcategory === 'milk-solids' && p.id === 2); });
            return (
                <div className="container page">
                    <div style={{ marginTop: 34 }}>
                        <button className="back-btn" onClick={goBack}><IcBack size={18} /> Back</button>
                    </div>

                    <div className="profile-card">
                        <div className="profile-avatar">A</div>
                        <div className="profile-meta">
                            <h2>Aarav Sharma</h2>
                            <p>aarav.sharma@example.com</p>
                            <div className="profile-stats">
                                <div className="stat"><b>12</b><span>Scans</span></div>
                                <div className="stat"><b>4</b><span>Saved</span></div>
                                <div className="stat"><b>2</b><span>Reports</span></div>
                            </div>
                        </div>
                    </div>

                    <h2 className="section-title">Saved / Scanned Products</h2>
                    <div className="product-grid">
                        {saved.map((p) => <ProductCard key={p.id} p={p} />)}
                    </div>

                    <h2 className="section-title">Settings</h2>
                    <div className="panel">
                        <button className="settings-row"><span className="ic"><IcUser size={20} /></span> Account Information</button>
                        <button className="settings-row"><span className="ic"><IcBell size={20} /></span> Notifications</button>
                        <button className="settings-row"><span className="ic"><IcSettings size={20} /></span> App Settings</button>
                        <button className="settings-row"><span className="ic"><IcShield size={20} /></span> Privacy & Safety</button>
                        <button className="settings-row"><span className="ic"><IcLogout size={20} /></span> Log out</button>
                    </div>
                </div>
            );
        }
    </script>

    <!-- ============================================================
         APP — splash, routing & bottom nav
         ============================================================ -->
    <script type="text/babel" data-presets="react">
        function BottomNav({ active }) {
            const items = [
                { key: 'home', label: 'Home', Icon: IcHome, path: '/', active: active === 'home' },
                { key: 'scan', label: 'Scan', Icon: IcScan, path: '/scan', active: active === 'scan', scan: true },
                { key: 'categories', label: 'Categories', Icon: IcGrid, path: '/categories', active: active === 'categories' },
                //{ key: 'profile', label: 'Profile', Icon: IcUser, path: '/profile', active: active === 'profile' }
            ];
            return (
                <nav className="bottom-nav">
                    {items.map((it) => (
                        <button key={it.key} className={'nav-item' + (it.active ? ' active' : '')} onClick={() => go(it.path)}>
                            {it.scan
                                ? <span className="nav-scan"><IcScan size={24} color="#fff" /></span>
                                : <span className="ic"><it.Icon size={22} /></span>}
                            <span>{it.label}</span>
                        </button>
                    ))}
                </nav>
            );
        }

        function activeTabFor(route) {
            if (route.name === 'scan') return 'scan';
            if (route.name === 'categories') return 'categories';
            if (route.name === 'profile') return 'profile';
            return 'home';
        }

        function App() {
            const [stage, setStage] = React.useState('splash'); // splash | ready
            const [route, setRoute] = React.useState(Router());

            React.useEffect(() => {
                const t = setTimeout(() => setStage('ready'), 2300);
                const onHash = () => setRoute(Router());
                window.addEventListener('hashchange', onHash);
                return () => { clearTimeout(t); window.removeEventListener('hashchange', onHash); };
            }, []);
            if (stage === 'splash') return <Splash />;

            const r = route;
            let page;
            if (r.name === 'home') page = <HomePage />;
            else if (r.name === 'profile') page = <ProfilePage />;
            else if (r.name === 'categories') page = <CategoriesPage />;
            else if (r.name === 'category') page = <CategoryPage id={r.params.id} />;
            else if (r.name === 'list') page = <ListPage id={r.params.id} />;
            else if (r.name === 'product') page = <ProductPage id={r.params.id} category={r.params.category} subCategory={r.params.subCategory} />;
            else if (r.name === 'scan') page = <ScannerPage variant={r.params.variant} />;
            else page = <HomePage />;

            return (
                <div>
                    <Header onProfile={() => go('/profile')} />
                    {page}
                    <div className="nav-spacer" />
                    <BottomNav active={activeTabFor(r)} />
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
